<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huka Voice Chat - Room</title>
    <link rel="stylesheet" href="room.css">
</head>
<body>

<header class="topbar">
    <button onclick="exitRoom()">←</button>
    <div class="room-info">
        <h2 id="roomName">HUKA ROOM</h2>
        <small>Room ID: <span id="roomId">100011</span></small>
    </div>
    <button onclick="openMore()">⋮</button>
</header>

<section class="room-stats">
    <span>👥 <b id="onlineCount">0</b></span>
    <span>🏆 Ranking</span>
    <span>💰 <b id="myCoins">0</b> Coins</span>
</section>

<section class="announcement" id="announcement">
    ❤️ Welcome to Huka Voice Chat!
</section>

<section class="video-area" id="videoArea">
    <div id="youtubePlayer"></div>
    <input id="youtubeLink" placeholder="Paste YouTube Video Link">
    <button onclick="playYouTube()">▶ Play Video</button>
</section>

<section class="seats-section">
    <div class="seat-heading">
        <h3>🎙️ Voice Seats</h3>
        <select id="seatCount" onchange="changeSeats()">
            <option value="9">9 Seats</option>
            <option value="11">11 Seats</option>
            <option value="15">15 Seats</option>
            <option value="20">20 Seats</option>
        </select>
    </div>
    <div id="seats" class="seats"></div>
</section>

<section class="music-area">
    <h3>🎵 Room Music</h3>
    <input type="file" id="mp3File" accept="audio/mpeg,audio/mp3">
    <audio id="musicPlayer" controls></audio>
</section>

<section class="live-effects" id="liveEffects"></section>

<section class="chat-section">
    <h3>💬 Room Chat</h3>
    <div id="chatMessages" class="chat-messages"></div>
</section>

<div class="gift-ranking">
    <h3>🏆 Room Gift Ranking</h3>
    <div id="giftRanking">No gifts yet</div>
</div>

<div class="bottom-bar">
    <button onclick="mentionUser()">@</button>
    <button onclick="openEmoji()">😊</button>
    <button onclick="toggleSpeaker()">🔊</button>
    <button onclick="toggleMic()" id="micButton">🎙️</button>
    <button onclick="openInbox()">📩</button>
    <button onclick="openGifts()">🎁</button>
    <button onclick="openMore()">More</button>
</div>

<div id="giftPanel" class="panel">
    <div class="panel-header">
        <h2>🎁 Huka Gifts</h2>
        <button onclick="closePanels()">✕</button>
    </div>
    <div class="gift-categories">
        <button onclick="showGifts('All')">All</button>
        <button onclick="showGifts('Customization')">Customization</button>
        <button onclick="showGifts('Lucky')">Lucky</button>
        <button onclick="showGifts('VIP')">VIP</button>
        <button onclick="showGifts('Love')">Love</button>
        <button onclick="showGifts('Royal')">Royal</button>
        <button onclick="showGifts('Premium')">Premium</button>
    </div>
    <div id="giftList" class="gift-list"></div>
</div>

<div id="emojiPanel" class="panel">
    <h3>😊 Emoji & Stickers</h3>
    <div id="emojiList">
        <button onclick="sendEmoji('❤️')">❤️</button>
        <button onclick="sendEmoji('😂')">😂</button>
        <button onclick="sendEmoji('😍')">😍</button>
        <button onclick="sendEmoji('🔥')">🔥</button>
        <button onclick="sendEmoji('👏')">👏</button>
        <button onclick="sendEmoji('🥰')">🥰</button>
    </div>
    <button onclick="closePanels()">Close</button>
</div>

<div id="inboxPanel" class="panel">
    <h3>📩 Inbox</h3>
    <div id="inboxMessages">No new messages</div>
    <button onclick="closePanels()">Close</button>
</div>

<div id="morePanel" class="panel">
    <h3>⚙️ More Options</h3>
    <button onclick="openRoomSettings()">Room Settings</button>
    <button onclick="openYouTube()">YouTube Video</button>
    <button onclick="openMusic()">MP3 Music</button>
    <button onclick="showRanking()">Gift Ranking</button>
    <button onclick="clearChat()">Clear Chat</button>
    <button onclick="closePanels()">Close</button>
</div>

<div id="settingsPanel" class="panel">
    <h3>⚙️ Room Settings</h3>
    <input id="newRoomName" placeholder="Room Name">
    <input id="newAnnouncement" placeholder="Announcement">
    <button onclick="saveRoomSettings()">Save Settings</button>
    <button onclick="closePanels()">Close</button>
</div>

<div id="mentionPanel" class="panel">
    <h3>@ Mention User</h3>
    <div id="mentionUsers"></div>
    <button onclick="closePanels()">Close</button>
</div>

<script src="/socket.io/socket.io.js"></script>

<script src="room.js"></script>

</body>
</html>
