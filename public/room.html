<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huka Voice Chat Room</title>
<script src="/socket.io/socket.io.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,sans-serif;
  color:white;
  background:#080b20;
  min-height:100vh;
}

.room{
  min-height:100vh;
  padding:15px 12px 100px;
  background:
  radial-gradient(ellipse at 50% 30%,#54236f,transparent 55%),
  radial-gradient(ellipse at 15% 65%,#122d67,transparent 50%),
  radial-gradient(ellipse at 90% 75%,#47105e,transparent 50%),
  linear-gradient(160deg,#151329,#080b20);
  position:relative;
  overflow:hidden;
}

.room:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.35;
  background-image:
  radial-gradient(circle,#ff61d8 2px,transparent 3px),
  radial-gradient(circle,#39c9ff 2px,transparent 3px),
  radial-gradient(circle,#b96bff 2px,transparent 3px);
  background-size:90px 110px,130px 150px,170px 180px;
}

.content{
  position:relative;
  z-index:2;
  max-width:600px;
  margin:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.topbar button{
  background:none;
  border:0;
  color:white;
  font-size:27px;
}

.room-title{
  font-weight:bold;
  font-size:18px;
}

.room-info{
  text-align:right;
  font-size:11px;
  color:#ddd;
}

.owner{
  text-align:center;
  margin-bottom:28px;
}

.owner-avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  margin:auto;
  border:3px solid #e6a5ff;
  box-shadow:0 0 22px #d34cff;
  background:linear-gradient(135deg,#ff79d2,#654cff);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:35px;
}

.owner-avatar img,.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.owner-name{
  margin-top:9px;
  font-size:14px;
}

.owner-label{
  display:inline-block;
  background:#6447d9;
  padding:5px 12px;
  border-radius:20px;
  font-size:10px;
  margin-top:6px;
}

.room-subtitle{
  text-align:center;
  font-size:12px;
  color:#d9b8f6;
  margin-bottom:15px;
}

.seat-settings{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  margin-bottom:24px;
}

.seat-settings button{
  border:1px solid #ffffff30;
  background:#ffffff15;
  color:white;
  padding:7px 12px;
  border-radius:20px;
  font-size:11px;
}

.seat-settings button.active{
  background:linear-gradient(90deg,#a43bdf,#ed4fae);
  border:0;
}

.seat-settings button:disabled{
  opacity:.7;
}

.seats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:25px 7px;
  justify-items:center;
  margin-bottom:25px;
}

.seat{
  width:100%;
  text-align:center;
  cursor:pointer;
}

.avatar{
  width:58px;
  height:58px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#a24cdb,#4d6ee8);
  border:2px solid #d78aff;
  box-shadow:0 0 13px #8c4dff80;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-size:26px;
  position:relative;
}

.seat.empty .avatar{
  background:#ffffff18;
  border:1px solid #ffffff30;
  box-shadow:none;
  color:#c9c5dc;
}

.seat.me .avatar{
  border:2px solid #44f5b3;
}

.seat-name{
  margin-top:7px;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.seat-number{
  margin-top:5px;
  font-size:10px;
  color:#c9b8e9;
}

.mic-indicator{
  position:absolute;
  bottom:0;
  right:0;
  background:#ff4d9b;
  border-radius:50%;
  font-size:10px;
  padding:3px;
}

.online-status{
  text-align:center;
  font-size:12px;
  color:#cdb5f3;
  margin:20px 0;
}

.coins{
  text-align:center;
  color:#ffd77a;
  font-size:13px;
  margin:12px 0;
}

.notice{
  text-align:center;
  color:#ffb8e9;
  font-size:12px;
  min-height:20px;
  margin:8px;
}

.chat-box{
  display:none;
  background:#160f30eF;
  border:1px solid #ffffff25;
  border-radius:16px;
  padding:13px;
  margin-top:20px;
}

.chat-box.show{display:block}

.chat-heading{
  display:flex;
  justify-content:space-between;
  margin-bottom:12px;
}

.chat-heading button{
  background:none;
  color:white;
  border:0;
  font-size:19px;
}

.chat-messages{
  height:145px;
  overflow-y:auto;
  font-size:12px;
}

.message{
  padding:6px 0;
  overflow-wrap:anywhere;
}

.message strong{
  color:#ff9bdb;
}

.chat-input{
  display:flex;
  gap:7px;
  margin-top:10px;
}

input,select{
  background:#ffffff15;
  color:white;
  border:1px solid #ffffff30;
  border-radius:20px;
  padding:11px;
  outline:none;
}

input{flex:1;min-width:0}

select option{
  background:#21153d;
  color:white;
}

.send-btn{
  border:0;
  border-radius:20px;
  background:linear-gradient(90deg,#a43bdf,#ed4fae);
  color:white;
  padding:0 17px;
}

.bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  z-index:10;
  background:#100c27f5;
  border-top:1px solid #ffffff25;
  padding:11px 5px 18px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  backdrop-filter:blur(15px);
}

.control{
  background:none;
  border:0;
  color:white;
  font-size:21px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:5px;
  cursor:pointer;
}

.control span{
  font-size:9px;
}

.control.off{color:#ff579b}

.gift-control{
  background:linear-gradient(135deg,#ff54bd,#9747ee);
  width:45px;
  height:45px;
  border-radius:50%;
  justify-content:center;
}

.popup{
  display:none;
  position:fixed;
  bottom:85px;
  left:10px;
  right:10px;
  max-width:580px;
  margin:auto;
  z-index:20;
  background:#21153d;
  border:1px solid #b55aff;
  border-radius:18px;
  padding:17px;
  box-shadow:0 0 25px #0009;
  max-height:65vh;
  overflow-y:auto;
}

.popup.show{display:block}

.popup-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}

.popup-title button{
  color:white;
  background:none;
  border:0;
  font-size:20px;
}

.popup-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.popup-grid button{
  background:#ffffff15;
  border:1px solid #ffffff20;
  color:white;
  border-radius:12px;
  padding:12px 4px;
  font-size:22px;
}

.popup-grid small{
  display:block;
  font-size:10px;
  margin-top:5px;
}

.popup select,.popup input{
  width:100%;
  margin-bottom:10px;
  border-radius:10px;
}

.popup-action{
  width:100%;
  padding:12px;
  border:0;
  border-radius:10px;
  background:linear-gradient(90deg,#a43bdf,#ed4fae);
  color:white;
  margin-top:8px;
}

.member-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.member-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#ffffff12;
  border-radius:10px;
  padding:10px;
  font-size:12px;
}

.member-item button{
  border:0;
  background:#8f42c9;
  color:white;
  padding:7px 10px;
  border-radius:10px;
}

#giftAnimation{
  position:fixed;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:50;
  font-size:65px;
  display:none;
  text-align:center;
  text-shadow:0 0 25px #ff45d4;
  pointer-events:none;
}

#giftAnimation.show{
  display:block;
  animation:giftPop 1.5s ease;
}

@keyframes giftPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}
  40%{opacity:1;transform:translate(-50%,-50%) scale(1.3)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1)}
}

@media(max-width:360px){
  .avatar{width:49px;height:49px}
  .seats{gap:20px 4px}
  .control{font-size:18px}
  .control span{font-size:8px}
}
</style>
</head>

<body>

<div class="room">
<div class="content">

  <div class="topbar">
    <button onclick="leaveRoom()">‹</button>
    <div class="room-title">HUKA ♡</div>
    <div class="room-info">
      ROOM ID<br>
      <b id="roomIdText">------</b>
    </div>
  </div>

  <div class="owner">
    <div class="owner-avatar" id="ownerAvatar">👑</div>
    <div class="owner-name" id="ownerName">Huka Owner</div>
    <div class="owner-label">👑 ROOM OWNER</div>
  </div>

  <div class="room-subtitle" id="roomName">
    Huka Friends Room
  </div>

  <div class="seat-settings" id="seatSettings">
    <button onclick="changeSeats(9)">9 Seats</button>
    <button onclick="changeSeats(11)">11 Seats</button>
    <button onclick="changeSeats(15)">15 Seats</button>
    <button onclick="changeSeats(20)">20 Seats</button>
  </div>

  <div class="seats" id="seats"></div>

  <div class="online-status" id="onlineStatus">
    Connecting to Huka...
  </div>

  <div class="coins" id="coinBalance">
    🪙 0 Coins
  </div>

  <div class="notice" id="notice"></div>

  <div class="chat-box" id="chatBox">

    <div class="chat-heading">
      <b>💬 Room Chat</b>
      <button onclick="toggleChat()">✕</button>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="chat-input">
      <input id="chatInput"
        placeholder="Write a message..."
        maxlength="500">

      <button class="send-btn"
        onclick="sendMessage()">Send</button>
    </div>

  </div>

</div>
</div>

<!-- BOTTOM BAR -->

<div class="bottom-bar">

  <button class="control" onclick="mention()">
    @
    <span>MENTION</span>
  </button>

  <button class="control" onclick="openPopup('emojiPopup')">
    😊
    <span>STICKERS</span>
  </button>

  <button class="control" onclick="toggleSpeaker()" id="speakerBtn">
    🔊
    <span>SPEAKER</span>
  </button>

  <button class="control off" onclick="toggleMic()" id="micBtn">
    🔇
    <span>MIC OFF</span>
  </button>

  <button class="control" onclick="openInbox()">
    📩
    <span>INBOX</span>
  </button>

  <button class="control gift-control"
    onclick="openPopup('giftPopup')">
    🎁
    <span>GIFT</span>
  </button>

</div>

<!-- EMOJI POPUP -->

<div class="popup" id="emojiPopup">

  <div class="popup-title">
    <b>😊 Emojis & Stickers</b>
    <button onclick="closePopups()">✕</button>
  </div>

  <div class="popup-grid">

    <button onclick="sendEmoji('😀')">😀</button>
    <button onclick="sendEmoji('😂')">😂</button>
    <button onclick="sendEmoji('😍')">😍</button>
    <button onclick="sendEmoji('🥰')">🥰</button>
    <button onclick="sendEmoji('😘')">😘</button>
    <button onclick="sendEmoji('😎')">😎</button>
    <button onclick="sendEmoji('😭')">😭</button>
    <button onclick="sendEmoji('🔥')">🔥</button>
    <button onclick="sendEmoji('❤️')">❤️</button>
    <button onclick="sendEmoji('💖')">💖</button>
    <button onclick="sendEmoji('🎉')">🎉</button>
    <button onclick="sendEmoji('👏')">👏</button>
    <button onclick="sendEmoji('🌹')">🌹</button>
    <button onclick="sendEmoji('💎')">💎</button>
    <button onclick="sendEmoji('👑')">👑</button>

  </div>
</div>

<!-- GIFT POPUP -->

<div class="popup" id="giftPopup">

  <div class="popup-title">
    <b>🎁 Huka Gift Store</b>
    <button onclick="closePopups()">✕</button>
  </div>

  <div class="coins" id="giftCoins">
    🪙 0 Coins
  </div>

  <label>Send Gift To</label>

  <select id="giftReceiver">
    <option value="Everyone">Everyone</option>
  </select>

  <div class="popup-grid">

    <button onclick="sendGift('Rose')">
      🌹<small>Rose</small><small>10 Coins</small>
    </button>

    <button onclick="sendGift('Heart')">
      ❤️<small>Heart</small><small>50 Coins</small>
    </button>

    <button onclick="sendGift('Crown')">
      👑<small>Crown</small><small>100 Coins</small>
    </button>

    <button onclick="sendGift('Diamond')">
      💎<small>Diamond</small><small>500 Coins</small>
    </button>

    <button onclick="sendGift('Rocket')">
      🚀<small>Rocket</small><small>1000 Coins</small>
    </button>

    <button onclick="sendGift('Castle')">
      🏰<small>Castle</small><small>5000 Coins</small>
    </button>

    <button onclick="sendGift('Galaxy')">
      🌌<small>Galaxy</small><small>10000 Coins</small>
    </button>

  </div>
</div>

<!-- INBOX POPUP -->

<div class="popup" id="inboxPopup">

  <div class="popup-title">
    <b>📩 Private Inbox</b>
    <button onclick="closePopups()">✕</button>
  </div>

  <select id="inboxReceiver">
    <option value="">Select a member</option>
  </select>

  <div class="chat-messages" id="inboxMessages"></div>

  <input id="inboxInput"
    placeholder="Private message..."
    maxlength="500">

  <button class="popup-action"
    onclick="sendInboxMessage()">Send Message</button>

</div>

<!-- MEMBER POPUP -->

<div class="popup" id="memberPopup">

  <div class="popup-title">
    <b>👤 Member Details</b>
    <button onclick="closePopups()">✕</button>
  </div>

  <div id="memberDetails"></div>

</div>

<div id="giftAnimation">🎁</div>

<script>

const socket = io();

const params = new URLSearchParams(location.search);

const roomId =
  params.get("room") ||
  params.get("roomId") ||
  localStorage.getItem("hukaMyRoom") ||
  "";

let user = null;
let roomData = null;
let members = [];
let messages = [];
let myId = "";
let micOn = false;
let speakerOn = true;
let roomJoined = false;
let inboxMessages = [];

const giftPrices = {
  Rose:10,
  Heart:50,
  Crown:100,
  Diamond:500,
  Rocket:1000,
  Castle:5000,
  Galaxy:10000
};

const giftEmojis = {
  Rose:"🌹",
  Heart:"❤️",
  Crown:"👑",
  Diamond:"💎",
  Rocket:"🚀",
  Castle:"🏰",
  Galaxy:"🌌"
};

document.getElementById("roomIdText").textContent =
  roomId || "------";

const savedName =
  localStorage.getItem("hukaName") || "Huka User";

const savedId =
  localStorage.getItem("hukaUserId") || "";

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function avatarHTML(value){

  if(value && /^https?:\/\//i.test(value)){
    return `<img src="${escapeHTML(value)}" alt="Avatar">`;
  }

  return escapeHTML(value || "👤");
}

function notice(message){

  const el = document.getElementById("notice");

  el.textContent = message;

  clearTimeout(window.noticeTimer);

  window.noticeTimer = setTimeout(()=>{
    el.textContent = "";
  },3500);

}

function updateCoins(){

  const coins = user?.coins ?? 0;

  document.getElementById("coinBalance").textContent =
    "🪙 " + coins + " Coins";

  document.getElementById("giftCoins").textContent =
    "🪙 " + coins + " Coins";

}

// REGISTER AND JOIN

socket.on("connect",()=>{

  document.getElementById("onlineStatus").textContent =
    "Registering Huka Profile...";

  if(!roomId){
    notice("Room ID missing. Please open a room from Home.");
    return;
  }

  socket.emit("register",{
    name:savedName,
    userId:savedId
  },response=>{

    if(!response || !response.ok){
      notice(response?.message || "Registration failed");
      return;
    }

    user = response.user;
    myId = user.id;

    localStorage.setItem("hukaUserId",user.id);
    localStorage.setItem("hukaName",user.name);

    updateCoins();

    document.getElementById("ownerAvatar").innerHTML =
      avatarHTML(user.avatar);

    joinRoom();

  });

});

function joinRoom(){

  socket.emit("join-room",{
    roomId:roomId
  },response=>{

    if(!response || !response.ok){

      document.getElementById("onlineStatus").textContent =
        response?.message || "Room join failed";

      notice(response?.message || "Unable to join room");

      return;
    }

    roomJoined = true;

    roomData = response.room;

    members = response.members || [];

    messages = response.messages || [];

    document.getElementById("roomName").textContent =
      roomData.name || "Huka Friends Room";

    renderMembers();
    renderChat();
    updateSeatSettings();

    document.getElementById("onlineStatus").textContent =
      "🟢 " + members.length + " Members Online";

  });

}

// LIVE MEMBERS

socket.on("members",data=>{

  members = Array.isArray(data) ? data : [];

  renderMembers();

  updateGiftReceivers();
  updateInboxReceivers();

  document.getElementById("onlineStatus").textContent =
    "🟢 " + members.length + " Members Online";

});

socket.on("room-update",data=>{

  if(!data) return;

  roomData = {
    ...roomData,
    ...data
  };

  document.getElementById("roomName").textContent =
    roomData.name || "Huka Friends Room";

  renderMembers();
  updateSeatSettings();

});

socket.on("disconnect",()=>{

  roomJoined = false;

  document.getElementById("onlineStatus").textContent =
    "Connection lost. Reconnecting...";

});

socket.on("connect_error",()=>{

  document.getElementById("onlineStatus").textContent =
    "Server connection problem";

});

// OWNER AND MEMBERS

function renderMembers(){

  const owner = members.find(member=>member.isOwner);

  const ownerName =
    owner?.name || user?.name || "Huka Owner";

  const ownerAvatar =
    owner?.avatar || user?.avatar || "👑";

  document.getElementById("ownerName").textContent =
    ownerName;

  document.getElementById("ownerAvatar").innerHTML =
    avatarHTML(ownerAvatar);

  renderSeats();

}

// SEATS

function renderSeats(){

  const container = document.getElementById("seats");

  container.innerHTML = "";

  const count = Number(roomData?.seats || 9);

  for(let i=1;i<=count;i++){

    const member = members.find(
      item=>Number(item.seat)===i
    );

    const div = document.createElement("div");

    div.className = "seat";

    if(member){

      const isMe = member.id === myId;

      if(isMe) div.classList.add("me");

      div.innerHTML = `
        <div class="avatar">
          ${avatarHTML(member.avatar)}
          ${member.micOn ? "" : '<span class="mic-indicator">🔇</span>'}
        </div>

        <div class="seat-name">
          ${escapeHTML(member.name)}
        </div>

        <div class="seat-number">
          ${member.isOwner ? "👑 Owner" :
            member.isAdmin ? "⭐ Admin" :
            "Seat "+i}
        </div>
      `;

      div.onclick = ()=>{
        openMember(member);
      };

    }else{

      div.classList.add("empty");

      div.innerHTML = `
        <div class="avatar">🛋️</div>
        <div class="seat-name">Empty</div>
        <div class="seat-number">${i}</div>
      `;

      div.onclick = ()=>{
        joinSeat(i);
      };

    }

    container.appendChild(div);

  }

}

// JOIN SEAT

function joinSeat(seat){

  if(!roomJoined){
    notice("Join room first");
    return;
  }

  socket.emit("join-seat",{seat},response=>{

    if(!response || !response.ok){
      notice(response?.message || "Seat not available");
      return;
    }

    notice("You joined seat "+seat+" ❤️");

  });

}

// LEAVE SEAT

function leaveSeat(){

  socket.emit("leave-seat",response=>{

    if(response?.ok){
      notice("You left your seat");
      closePopups();
    }else{
      notice(response?.message || "Unable to leave seat");
    }

  });

}

// CHANGE SEATS - OWNER ONLY

function updateSeatSettings(){

  const buttons =
    document.querySelectorAll("#seatSettings button");

  const isOwner = members.some(
    member=>member.id===myId && member.isOwner
  );

  buttons.forEach(button=>{

    const count = Number(
      button.textContent.replace(" Seats","")
    );

    button.classList.toggle(
      "active",
      count===Number(roomData?.seats || 9)
    );

    button.disabled = !isOwner;

  });

}

function changeSeats(count){

  if(!members.some(member=>member.id===myId && member.isOwner)){
    notice("Only room owner can change seats");
    return;
  }

  socket.emit("update-room-settings",{
    seats:count
  },response=>{

    if(!response || !response.ok){
      notice(response?.message || "Seat update failed");
      return;
    }

    notice(count+" seats activated");

  });

}

// MIC

function toggleMic(){

  if(!roomJoined) return;

  const newState = !micOn;

  socket.emit("toggle-mic",{
    micOn:newState
  },response=>{

    if(!response || !response.ok){
      notice(response?.message || "Mic update failed");
      return;
    }

    micOn = response.micOn;

    const btn = document.getElementById("micBtn");

    btn.innerHTML = micOn
      ? '🎙️<span>MIC ON</span>'
      : '🔇<span>MIC OFF</span>';

    btn.classList.toggle("off",!micOn);

  });

}

// SPEAKER

function toggleSpeaker(){

  speakerOn = !speakerOn;

  const btn = document.getElementById("speakerBtn");

  btn.innerHTML = speakerOn
    ? '🔊<span>SPEAKER</span>'
    : '🔈<span>MUTED</span>';

  btn.classList.toggle("off",!speakerOn);

}

// CHAT

socket.on("chatMessage",message=>{

  addMessage(message);

});

function addMessage(message){

  const box = document.getElementById("chatMessages");

  const div = document.createElement("div");

  div.className = "message";

  const strong = document.createElement("strong");

  strong.textContent =
    (message.username || "User") + ": ";

  const text = document.createTextNode(
    message.message || ""
  );

  div.append(strong,text);

  box.appendChild(div);

  box.scrollTop = box.scrollHeight;

}

function renderChat(){

  const box = document.getElementById("chatMessages");

  box.innerHTML = "";

  messages.forEach(addMessage);

}

function sendMessage(){

  const input = document.getElementById("chatInput");

  const message = input.value.trim();

  if(!message || !roomJoined) return;

  socket.emit("send-message",{
    message
  },response=>{

    if(!response || !response.ok){
      notice(response?.message || "Message failed");
      return;
    }

  });

  input.value = "";

}

document.getElementById("chatInput")
.addEventListener("keydown",event=>{

  if(event.key==="Enter"){
    sendMessage();
  }

});

socket.on("chat-cleared",()=>{

  document.getElementById("chatMessages").innerHTML = "";

  notice("Chat cleared");

});

function toggleChat(){

  closePopups();

  document.getElementById("chatBox")
    .classList.toggle("show");

}

function mention(){

  closePopups();

  document.getElementById("chatBox")
    .classList.add("show");

  const input = document.getElementById("chatInput");

  input.value = "@";

  input.focus();

}

// EMOJI

function sendEmoji(emoji){

  socket.emit("send-emoji",{
    emoji
  },response=>{

    if(!response || !response.ok){
      notice(response?.message || "Emoji failed");
      return;
    }

    closePopups();

  });

}

socket.on("emoji-received",data=>{

  const animation = document.getElementById("giftAnimation");

  animation.textContent = data.emoji;

  animation.classList.remove("show");

  void animation.offsetWidth;

  animation.classList.add("show");

});

// GIFTS

function updateGiftReceivers(){

  const select = document.getElementById("giftReceiver");

  const previous = select.value || "Everyone";

  select.innerHTML =
    '<option value="Everyone">Everyone</option>';

  members.forEach(member=>{

    if(member.id===myId) return;

    const option = document.createElement("option");

    option.value = member.id;

    option.textContent = member.name;

    select.appendChild(option);

  });

  if([...select.options].some(o=>o.value===previous)){
    select.value = previous;
  }

}

function sendGift(gift){

  const receiverId =
    document.getElementById("giftReceiver").value;

  if(!roomJoined) return;

  socket.emit("send-gift",{
    gift,
    receiverId
  },response=>{

    if(!response || !response.ok){

      notice(response?.message || "Gift failed");

      return;
    }

    if(user){
      user.coins = response.coins;
    }

    updateCoins();

    notice(gift+" sent successfully! 🎁");

    closePopups();

  });

}

socket.on("gift-received",data=>{

  const emoji =
    giftEmojis[data.gift] || "🎁";

  const animation =
    document.getElementById("giftAnimation");

  animation.textContent = emoji;

  animation.classList.remove("show");

  void animation.offsetWidth;

  animation.classList.add("show");

  notice(
    data.senderName+" sent "+data.gift+" 🎁"
  );

});


// INBOX

function updateInboxReceivers(){

  const select =
    document.getElementById("inboxReceiver");

  const previous = select.value;

  select.innerHTML =
    '<option value="">Select a member</option>';

  members.forEach(member=>{

    if(member.id===myId) return;

    const option = document.createElement("option");

    option.value = member.id;

    option.textContent = member.name;

    select.appendChild(option);

  });

  if([...select.options].some(o=>o.value===previous)){
    select.value = previous;
  }

}

function openInbox(){

  closePopups();

  openPopup("inboxPopup");

  socket.emit("get-inbox",response=>{

    if(!response || !response.ok){
      notice(response?.message || "Inbox failed");
      return;
    }

    inboxMessages = response.messages || [];

    renderInbox();

  });

}

function renderInbox(){

  const box = document.getElementById("inboxMessages");

  box.innerHTML = "";

  inboxMessages.forEach(message=>{

    const div = document.createElement("div");

    div.className = "message";

    const name = document.createElement("strong");

    name.textContent =
      message.senderName+": ";

    const text = document.createTextNode(
      message.message
    );

    div.append(name,text);

    box.appendChild(div);

  });

}

function sendInboxMessage(){

  const receiverId =
    document.getElementById("inboxReceiver").value;

  const input =
    document.getElementById("inboxInput");

  const message = input.value.trim();

  if(!receiverId){
    notice("Select a member");
    return;
  }

  if(!message) return;

  socket.emit("send-inbox-message",{
    receiverId,
    message
  },response=>{

    if(!response || !response.ok){
      notice(response?.message || "Message failed");
      return;
    }

    notice("Private message sent");

    input.value = "";

    closePopups();

  });

}

socket.on("inbox-message",message=>{

  inboxMessages.push(message);

  renderInbox();

  notice("📩 New private message");

});

// MEMBER DETAILS

function openMember(member){

  const box = document.getElementById("memberDetails");

  const isMe = member.id===myId;

  box.innerHTML = `
    <div style="text-align:center;padding:12px">

      <div class="owner-avatar">
        ${avatarHTML(member.avatar)}
      </div>

      <h3 style="margin-top:12px">
        ${escapeHTML(member.name)}
      </h3>

      <p style="margin-top:8px;font-size:12px">
        Profile ID: ${escapeHTML(member.id)}
      </p>

      <p style="margin-top:8px">
        ${member.isOwner ? "👑 Room Owner" :
          member.isAdmin ? "⭐ Admin" : "Member"}
      </p>

      ${isMe
        ? '<button class="popup-action" onclick="leaveSeat()">Leave Seat</button>'
        : ''
      }

    </div>
  `;

  openPopup("memberPopup");

}

// POPUPS

function openPopup(id){

  closePopups();

  document.getElementById(id)
    .classList.add("show");

}

function closePopups(){

  document.querySelectorAll(".popup")
    .forEach(p=>p.classList.remove("show"));

}

// LEAVE ROOM

function leaveRoom(){

  if(!roomJoined){
    location.href="/";
    return;
  }

  socket.emit("leave-room",()=>{

    roomJoined = false;

    socket.disconnect();

    location.href="/";

  });

}

window.addEventListener("beforeunload",()=>{

  if(socket.connected && roomJoined){
    socket.emit("leave-room");
  }

});

updateCoins();

</script>

</body>
