<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Huka Voice Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(145deg, #160d24, #351447, #651c70);
    }

    .header {
      padding: 22px 15px;
      text-align: center;
      background: linear-gradient(135deg, #7928bd, #e83caa);
      border-radius: 0 0 25px 25px;
    }

    .logo {
      font-size: 30px;
      font-weight: bold;
    }

    .online {
      font-size: 13px;
      margin-top: 7px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: #281638;
      border: 1px solid #8242a2;
      padding: 18px;
      margin-top: 15px;
      border-radius: 17px;
      box-shadow: 0 5px 18px #00000044;
    }

    h2 {
      color: #ff9bdc;
      font-size: 19px;
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #9852b6;
      border-radius: 10px;
      background: #190f25;
      color: white;
      font-size: 15px;
    }

    input::placeholder {
      color: #c5a9d1;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 15px;
      font-weight: bold;
      background: linear-gradient(135deg, #8738c9, #e83b9f);
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    .profile {
      text-align: center;
      line-height: 1.8;
    }

    .room-id {
      font-size: 24px;
      color: #ff9bdc;
      font-weight: bold;
    }

    #status {
      color: #ff9bdc;
      font-size: 13px;
      margin-top: 12px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .footer {
      text-align: center;
      padding: 25px 10px;
      color: #c8a9d6;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">HUKA ♡</div>
    <div class="online">Meet • Talk • Play • Make Friends</div>
  </div>

  <main class="container">

    <section class="card profile">
      <h2>My Profile</h2>

      <p>Name: <strong id="profileName">Huka User</strong></p>

      <p>Profile ID</p>
      <div class="room-id" id="profileId">--------</div>

      <p>Coins: <strong id="coins">0</strong></p>
      <p>Diamonds: <strong id="diamonds">0</strong></p>

      <button onclick="editProfile()">Edit Profile</button>
    </section>

    <section class="card">
      <h2>Join a Room</h2>

      <input
        id="joinRoomId"
        type="text"
        placeholder="Enter Room ID"
      >

      <button onclick="joinRoom()">
        Join Room
      </button>
    </section>

    <section class="card">
      <h2>Create Your Room</h2>

      <input
        id="newRoomName"
        type="text"
        placeholder="Enter Room Name"
        maxlength="40"
      >

      <button onclick="createRoom()">
        Create Room
      </button>
    </section>

    <div id="status">Connecting to Huka...</div>

  </main>

  <div class="footer">
    Huka Voice Chat © 2026
  </div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    let user = null;

    const savedName =
      localStorage.getItem("hukaName") || "";

    const savedId =
      localStorage.getItem("hukaUserId") || "";

    function status(message) {
      document.getElementById("status").textContent = message;
    }

    function editProfile() {
      const name = prompt(
        "Enter your display name:",
        savedName || "Huka User"
      );

      if (!name || !name.trim()) return;

      localStorage.setItem("hukaName", name.trim());

      status("Name saved. Reloading...");

      location.reload();
    }

    function registerUser() {
      let name = localStorage.getItem("hukaName");

      if (!name) {
        name = prompt("Enter your Huka name:");

        if (!name || !name.trim()) {
          name = "Huka User";
        }

        localStorage.setItem("hukaName", name.trim());
      }

      const profileId =
        localStorage.getItem("hukaUserId") || "";

      socket.emit(
        "register",
        {
          name: name.trim(),
          profileId: profileId
        },
        response => {
          if (!response || !response.ok) {
            status(response?.error || "Registration failed.");
            return;
          }

          user = response.user;

          localStorage.setItem("hukaUserId", user.id);
          localStorage.setItem("hukaName", user.name);

          showProfile(user);

          status("Welcome to Huka Voice Chat!");
        }
      );
    }

    function showProfile(data) {
      document.getElementById("profileName").textContent =
        data.name || "Huka User";

      document.getElementById("profileId").textContent =
        data.id || "--------";

      document.getElementById("coins").textContent =
        data.coins ?? 0;

      document.getElementById("diamonds").textContent =
        data.diamonds ?? 0;
    }

    function joinRoom() {
      const roomId =
        document.getElementById("joinRoomId").value.trim();

      if (!roomId) {
        alert("Please enter Room ID.");
        return;
      }

      if (!user) {
        alert("Please wait for profile registration.");
        return;
      }

      localStorage.setItem("hukaMyRoom", roomId);

      location.href =
        "room.html?room=" + encodeURIComponent(roomId);
    }

    function createRoom() {
      const name =
        document.getElementById("newRoomName").value.trim();

      if (!name) {
        alert("Please enter Room Name.");
        return;
      }

      if (!user) {
        alert("Please wait for profile registration.");
        return;
      }

      status("Creating room...");

      socket.emit(
        "create-room",
        { name: name },
        response => {
          if (!response || !response.ok) {
            status(response?.error || "Room creation failed.");
            return;
          }

          const roomId =
            response.room?.id ||
            response.roomId ||
            response.id;

          if (!roomId) {
            status("Room created, but Room ID was not returned.");
            return;
          }

          localStorage.setItem("hukaMyRoom", roomId);

          location.href =
            "room.html?room=" + encodeURIComponent(roomId);
        }
      );
    }

    socket.on("connect", () => {
      status("Connected. Registering profile...");
      registerUser();
    });

    socket.on("disconnect", () => {
      status("Disconnected. Reconnecting...");
    });

    socket.on("profile-update", data => {
      user = {
        ...user,
        ...data
      };

      showProfile(user);
    });
  </script>

</body>
</html>
