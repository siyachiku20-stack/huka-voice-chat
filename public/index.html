<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huka Voice Chat</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #160d25;
            color: white;
            font-family: Arial, sans-serif;
            padding-bottom: 85px;
        }

        button, input, select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: #211333;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff62bd;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .header-actions button {
            border: none;
            border-radius: 20px;
            padding: 9px 13px;
            color: white;
            background: #39234e;
        }

        .tabs {
            display: flex;
            gap: 25px;
            padding: 17px;
            border-bottom: 1px solid #392747;
        }

        .tabs button {
            border: none;
            background: none;
            color: #b9a9c9;
            font-size: 15px;
        }

        .tabs button.active {
            color: #ff62bd;
            font-weight: bold;
        }

        .welcome {
            margin: 15px;
            padding: 22px;
            border-radius: 18px;
            background: linear-gradient(120deg, #7629a8, #e63b9b);
        }

        .welcome h2 {
            margin-top: 0;
        }

        .welcome p {
            margin-bottom: 0;
        }

        .section {
            padding: 15px;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title h3 {
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 8px;
            margin: 15px;
        }

        .search-box input,
        .join-box input,
        .create-box input,
        .create-box select {
            width: 100%;
            padding: 13px;
            color: white;
            background: #291b38;
            border: 1px solid #49345d;
            border-radius: 10px;
            outline: none;
        }

        .country-list {
            display: flex;
            gap: 9px;
            overflow-x: auto;
            padding: 5px 15px 15px;
        }

        .country-list button {
            white-space: nowrap;
            padding: 9px 15px;
            border: 1px solid #53356c;
            border-radius: 20px;
            color: white;
            background: #291b38;
        }

        .room-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .room-card {
            background: #291b38;
            border: 1px solid #483056;
            border-radius: 15px;
            padding: 14px;
        }

        .room-card-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .room-card-icon {
            font-size: 34px;
        }

        .room-card-info {
            flex: 1;
            min-width: 0;
        }

        .room-card-info h3 {
            margin: 0 0 7px;
            overflow-wrap: anywhere;
        }

        .room-card-info p {
            margin: 4px 0;
            color: #c9b9d7;
            font-size: 13px;
        }

        .join-room-button,
        .main-button {
            border: none;
            border-radius: 20px;
            padding: 10px 17px;
            color: white;
            background: linear-gradient(120deg, #a12be0, #ed3c9d);
        }

        .join-box,
        .create-box {
            background: #291b38;
            padding: 16px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        .join-box h3,
        .create-box h3 {
            margin-top: 0;
        }

        .create-box input,
        .create-box select {
            margin-bottom: 10px;
        }

        .create-box button,
        .join-box button {
            width: 100%;
            margin-top: 10px;
        }

        .empty-rooms {
            text-align: center;
            padding: 25px;
            color: #c9b9d7;
            background: #291b38;
            border-radius: 15px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            background: #211333;
            border-top: 1px solid #49345d;
            padding: 12px 5px;
            z-index: 100;
        }

        .bottom-nav button {
            background: none;
            border: none;
            color: #bba9cc;
            font-size: 12px;
        }

        .bottom-nav button span {
            display: block;
            font-size: 21px;
            margin-bottom: 4px;
        }

        .bottom-nav button.active {
            color: #ff62bd;
        }

        @media (min-width: 650px) {
            .room-list {
                grid-template-columns: 1fr 1fr;
            }

            .page-content {
                max-width: 1000px;
                margin: auto;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo">HUKA♡</div>

        <div class="header-actions">
            <button type="button" id="searchNav">🔍</button>
            <button type="button" id="vipButton">VIP</button>
            <button type="button" id="profileBtn">👤</button>
        </div>
    </header>

    <main class="page-content">

        <!-- HOME TABS -->
        <nav class="tabs">
            <button class="active" id="homeTab">Hot</button>
            <button id="recommendTab">Recommend</button>
        </nav>

        <!-- WELCOME -->
        <section class="welcome">
            <h2>Welcome to Huka Voice Chat ♡</h2>
            <p>Meet new people, make friends and enjoy voice rooms.</p>
        </section>

        <!-- SEARCH -->
        <div class="search-box" id="searchSection">
            <input
                type="search"
                id="roomSearch"
                placeholder="Search room name or ID..."
            >
        </div>

        <!-- COUNTRY FILTER -->
        <div class="country-list">
            <button type="button" data-country="all">🌍 All</button>
            <button type="button" data-country="India">🇮🇳 India</button>
            <button type="button" data-country="Nepal">🇳🇵 Nepal</button>
            <button type="button" data-country="Pakistan">🇵🇰 Pakistan</button>
            <button type="button" data-country="Bangladesh">🇧🇩 Bangladesh</button>
            <button type="button" data-country="USA">🇺🇸 USA</button>
        </div>

        <!-- JOIN ROOM -->
        <section class="section">
            <div class="join-box">
                <h3>Join a Room</h3>

                <input
                    type="text"
                    id="joinRoomId"
                    placeholder="Enter Room ID"
                >

                <button
                    type="button"
                    class="main-button"
                    id="joinRoomBtn"
                >
                    Join Room
                </button>
            </div>
        </section>

        <!-- CREATE ROOM -->
        <section class="section">
            <div class="create-box">
                <h3>🎙️ Create Voice Room</h3>

                <input
                    type="text"
                    id="createRoomName"
                    placeholder="Enter Room Name"
                    maxlength="40"
                >

                <select id="createRoomSeats">
                    <option value="9">9 Seats</option>
                    <option value="11">11 Seats</option>
                    <option value="15">15 Seats</option>
                    <option value="20">20 Seats</option>
                </select>

                <button
                    type="button"
                    class="main-button"
                    id="createRoomBtn"
                >
                    + Create Room
                </button>
            </div>
        </section>

        <!-- VOICE ROOMS -->
        <section class="section">
            <div class="section-title">
                <h3>🔥 Popular Voice Rooms</h3>

                <button
                    type="button"
                    id="refreshRooms"
                    class="main-button"
                >
                    Refresh
                </button>
            </div>

            <div id="roomList" class="room-list">
                <div class="empty-rooms">
                    Loading rooms...
                </div>
            </div>
        </section>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">

        <button type="button" class="active" id="homeBtn">
            <span>🏠</span>
            Home
        </button>

        <button type="button" id="reelButton">
            <span>🎬</span>
            Reel
        </button>

        <button type="button" id="voiceButton">
            <span>🎙️</span>
            Voice
        </button>

        <button type="button" id="messageButton">
            <span>💬</span>
            Message
        </button>

        <button type="button" id="profileNav">
            <span>👤</span>
            Profile
        </button>

    </nav>

    <!-- SOCKET.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- HOME SCRIPT -->
    <script src="script.js"></script>

    <script>
        // Country filter
        document.querySelectorAll("[data-country]").forEach(button => {
            button.addEventListener("click", () => {
                const country = button.dataset.country;
                const select = document.getElementById("countryFilter");

                if (select) {
                    select.value = country;
                    select.dispatchEvent(new Event("change"));
                }
            });
        });

        // Search shortcut
        document.getElementById("searchNav").addEventListener("click", () => {
            document.getElementById("roomSearch").focus();
        });

        // Home tabs
        document.getElementById("homeTab").addEventListener("click", () => {
            document.getElementById("homeTab").classList.add("active");
            document.getElementById("recommendTab").classList.remove("active");
        });

        document.getElementById("recommendTab").addEventListener("click", () => {
            document.getElementById("recommendTab").classList.add("active");
            document.getElementById("homeTab").classList.remove("active");
        });

        // Navigation placeholders
        document.getElementById("voiceButton").addEventListener("click", () => {
            document.getElementById("roomList").scrollIntoView({
                behavior: "smooth"
            });
        });

        document.getElementById("vipButton").addEventListener("click", () => {
            alert("VIP section will be connected next.");
        });

        document.getElementById("reelButton").addEventListener("click", () => {
            alert("Reel section will be connected next.");
        });

        document.getElementById("messageButton").addEventListener("click", () => {
            alert("Message section will be connected next.");
        });
    </script>

</body>
</html>
