<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Huka Voice Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            HUKA<span>♡</span>
        </div>

        <div class="online">
            <span class="dot"></span>
            Online
        </div>

    </header>

    <main>

        <!-- Login -->

        <section id="loginSection" class="card">

            <h1>Welcome to Huka</h1>

            <p>Meet people. Make friends. Have fun.</p>

            <input
                type="text"
                id="username"
                placeholder="Enter your username"
                maxlength="20"
            >

            <button id="createProfile">
                Create My Profile
            </button>

            <p id="loginError" class="error"></p>

        </section>


        <!-- Dashboard -->

        <section id="dashboard" hidden>

            <div class="profile-card">

                <h2>My Profile</h2>

                <h3 id="displayName"></h3>

                <p>Profile ID</p>

                <div id="profileId" class="id-box"></div>

                <p>My Room ID</p>

                <div id="myRoomId" class="id-box"></div>

            </div>


            <div class="card">

                <h2>Join a Room</h2>

                <input
                    type="text"
                    id="roomInput"
                    placeholder="Enter Room ID"
                >

                <button id="joinRoom">
                    Join Room
                </button>

                <p id="roomError" class="error"></p>

            </div>


            <div id="roomSection" class="card" hidden>

                <h2>Room <span id="currentRoom"></span></h2>

                <div class="room-buttons">

                    <button id="voiceButton">
                        🎙️ Join Voice
                    </button>

                    <button id="leaveRoom" class="secondary">
                        Leave Room
                    </button>

                </div>

                <p id="voiceStatus">Voice disconnected</p>


                <h3>Members</h3>

                <div id="members"></div>


                <h3>Chat</h3>

                <div id="messages" class="messages"></div>

                <div class="chat-input">

                    <input
                        type="text"
                        id="messageInput"
                        placeholder="Write a message..."
                        maxlength="500"
                    >

                    <button id="sendMessage">Send</button>

                </div>


                <h3>Send a Gift</h3>

                <div class="gifts">

                    <button data-gift="Rose">🌹</button>

                    <button data-gift="Heart">❤️</button>

                    <button data-gift="Star">⭐</button>

                    <button data-gift="Diamond">💎</button>

                </div>

            </div>

        </section>

    </main>

    <footer>
        © 2026 Huka Voice Chat
    </footer>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>

</body>
</html>
