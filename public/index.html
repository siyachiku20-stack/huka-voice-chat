<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#260052">
<title>Huka Voice Chat</title>

<style>
:root {
  --bg:#19003d;
  --pink:#ed00d7;
  --purple:#8735ff;
  --muted:#bba8d5;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  background:radial-gradient(circle at 50% 0,#4a0879 0,#21004c 48%,#100022 100%);
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:82px;
}

.app {
  max-width:620px;
  margin:auto;
  min-height:100vh;
  padding:15px;
}

.top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 4px 17px;
}

.brand {
  font-weight:900;
  font-size:23px;
  letter-spacing:1px;
}

.brand b {
  color:#ff28df;
}

.top-actions {
  display:flex;
  gap:9px;
}

.circle {
  width:43px;
  height:43px;
  border-radius:50%;
  border:1px solid #ffffff35;
  background:#ffffff12;
  color:white;
  font-size:19px;
}

.tabs {
  display:flex;
  align-items:center;
  gap:12px;
  margin:2px 3px 17px;
}

.tab {
  border:0;
  background:transparent;
  color:#fff;
  padding:10px 16px;
  border-radius:22px;
  font-size:14px;
}

.tab.active {
  background:linear-gradient(90deg,#bd00db,#fa00c9);
  font-weight:bold;
}

.banner {
  height:116px;
  border-radius:19px;
  padding:18px;
  margin-bottom:17px;
  background:linear-gradient(110deg,#4b087f,#bd00c9 55%,#4314a7);
  position:relative;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid #ffffff28;
}

.banner:after {
  content:"✦ ✧ ✦";
  position:absolute;
  right:12px;
  top:10px;
  color:#ffd8ff;
  font-size:23px;
}

.banner small {
  font-size:10px;
  opacity:.9;
}

.banner h2 {
  font-size:22px;
  margin:6px 0;
}

.banner .mascot {
  font-size:50px;
}

.countries {
  display:flex;
  gap:9px;
  overflow:auto;
  padding:2px 0 17px;
  scrollbar-width:none;
}

.country {
  white-space:nowrap;
  border:1px solid #ffffff2c;
  border-radius:22px;
  padding:9px 14px;
  background:#ffffff0c;
  font-size:13px;
  color:white;
}

.section-title {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:8px 2px 12px;
}

.section-title h3 {
  font-size:17px;
  margin:0;
}

.section-title span {
  font-size:12px;
  color:var(--muted);
}

.rooms {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.room-card {
  min-height:195px;
  border-radius:18px;
  overflow:hidden;
  background:linear-gradient(145deg,#6c168c,#271052 70%);
  border:1px solid #ffffff24;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:12px;
}

.room-card:nth-child(4n+2) {
  background:linear-gradient(145deg,#9d3469,#28104f 75%);
}

.room-card:nth-child(4n+3) {
  background:linear-gradient(145deg,#3742a0,#211052 75%);
}

.room-card:nth-child(4n) {
  background:linear-gradient(145deg,#a34b63,#321052 75%);
}

.room-art {
  font-size:48px;
  text-align:center;
  padding:13px 0 4px;
}

.room-name {
  font-size:14px;
  font-weight:bold;
  overflow-wrap:anywhere;
}

.room-meta {
  font-size:11px;
  color:#eee;
  margin-top:5px;
}

.room-bottom {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
}

.room-type {
  font-size:10px;
  background:linear-gradient(90deg,#b500e9,#fa28c6);
  padding:7px 10px;
  border-radius:20px;
}

.join {
  border:0;
  border-radius:18px;
  padding:7px 11px;
  background:#ffffffed;
  color:#3a0758;
  font-weight:bold;
}

.empty {
  grid-column:1/-1;
  text-align:center;
  padding:25px 14px;
  background:#ffffff0d;
  border-radius:16px;
  color:#d7c5e8;
  font-size:13px;
}

.create {
  margin-top:17px;
  padding:15px;
  background:#ffffff0d;
  border:1px solid #ffffff22;
  border-radius:17px;
}

.create h3 {
  margin:0 0 10px;
  font-size:16px;
}

input,select {
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid #8d56bb;
  background:#1b0638;
  color:#fff;
  margin:5px 0 9px;
  font-size:14px;
}

.primary {
  width:100%;
  border:0;
  border-radius:12px;
  padding:13px;
  background:linear-gradient(90deg,#9d26ed,#ef00c9);
  color:white;
  font-weight:bold;
}

#status {
  text-align:center;
  color:#d9c2f4;
  font-size:11px;
  margin:13px 0;
}

.bottom {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  z-index:5;
  display:flex;
  justify-content:space-around;
  background:#08070b;
  border-top:1px solid #ffffff1a;
  padding:9px 3px max(9px,env(safe-area-inset-bottom));
}

.bottom a {
  color:#929096;
  text-decoration:none;
  text-align:center;
  font-size:11px;
  min-width:48px;
}

.bottom a span {
  display:block;
  font-size:21px;
  margin-bottom:4px;
}

.bottom a.active {
  color:#f000d7;
}

@media(min-width:600px) {
  .bottom {
    max-width:620px;
    left:50%;
    transform:translateX(-50%);
    border-radius:16px 16px 0 0;
  }
}
</style>
</head>

<body>

<main class="app">

<header class="top">

<div class="brand">
HUKA <b>♡</b>
</div>

<div class="top-actions">

<button class="circle" onclick="searchRooms()">⌕</button>

<button class="circle"
onclick="location.href='rankings.html'">🏆</button>

<button class="circle"
onclick="location.href='vip.html'">👑</button>

</div>
</header>

<nav class="tabs">

<button class="tab active"
id="hotTab"
onclick="setTab('hot')">
Hot
</button>

<button class="tab"
id="recommendTab"
onclick="setTab('recommend')">
Recommend
</button>

</nav>

<section class="banner">

<div>
<small>WELCOME TO HUKA VOICE CHAT</small>

<h2>Meet • Talk • Play</h2>

<small>Make friends and enjoy together 💜</small>
</div>

<div class="mascot">🐯</div>

</section>

<div class="countries">

<button class="country"
onclick="filterCountry('All')">
🌍 All
</button>

<button class="country"
onclick="filterCountry('India')">
🇮🇳 India
</button>

<button class="country"
onclick="filterCountry('Philippines')">
🇵🇭 Philippines
</button>

<button class="country"
onclick="filterCountry('Turkey')">
🇹🇷 Turkey
</button>

<button class="country"
onclick="filterCountry('Other')">
🌐 Other
</button>

</div>

<div class="section-title">

<h3>Popular Voice Rooms</h3>

<span id="roomCount">Live rooms</span>

</div>

<section class="rooms" id="roomsList">

<div class="empty">
Connecting to Huka rooms...
</div>

</section>

<section class="create">

<h3>＋ Create Your Room</h3>

<input
id="newRoomName"
maxlength="35"
placeholder="Enter room name">

<select id="seatCount">

<option value="9">9 Seats</option>
<option value="11">11 Seats</option>
<option value="15">15 Seats</option>
<option value="20">20 Seats</option>

</select>

<button class="primary" onclick="createRoom()">
Create Room
</button>

</section>

<div id="status">
Connecting to Huka...
</div>

</main>

<nav class="bottom">

<a class="active" href="index.html">
<span>⌂</span>Home
</a>

<a href="reel.html">
<span>▶</span>Reel
</a>

<a href="room.html?room=100001">
<span>🎙</span>Voice
</a>

<a href="inbox.html">
<span>▣</span>Message
</a>

<a href="profile.html">
<span>◉</span>Profile
</a>

</nav>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

let currentUser = null;
let allRooms = [];
let activeCountry = 'All';
let activeTab = 'hot';

const $ = id => document.getElementById(id);

function status(msg) {
  $('status').textContent = msg;
}

function register() {

  let name = localStorage.getItem('hukaName');

  if (!name) {

    name = prompt('Enter your Huka name:') || 'Huka User';

    name = name.trim() || 'Huka User';

    localStorage.setItem('hukaName',name);
  }

  socket.emit('register',{

    name,

    profileId:localStorage.getItem('hukaUserId') || ''

  },res => {

    if (!res || !res.ok) {

      status(res?.error || 'Profile registration failed');

      return;
    }

    currentUser = res.user;

    localStorage.setItem('hukaUserId',res.user.id);

    localStorage.setItem('hukaName',res.user.name);

    status('Welcome, ' + res.user.name + '!');

    socket.emit('get-rooms');

  });

}

socket.on('connect',register);

socket.on('disconnect',() => {
  status('Connection lost. Reconnecting...');
});

socket.on('room-list',rooms => {

  allRooms = Array.isArray(rooms) ? rooms : [];

  renderRooms();

});

socket.on('connect_error',() => {
  status('Could not connect. Please refresh.');
});

function renderRooms() {

  const list = $('roomsList');

  list.innerHTML = '';

  let rooms = allRooms.filter(r => {

    return activeCountry === 'All' ||

    (activeCountry === 'Other'
      ? r.country && r.country !== 'India'
      : r.country === activeCountry);

  });

  if (activeTab === 'recommend') {

    rooms = rooms.slice().sort((a,b) =>
      (b.members || 0) - (a.members || 0)
    );

  }

  $('roomCount').textContent = rooms.length + ' rooms';

  if (!rooms.length) {

    list.innerHTML = `
      <div class="empty">
      No live rooms right now.
      Create a room and invite friends! 💜
      </div>
    `;

    return;
  }

  rooms.forEach((room,i) => {

    const card = document.createElement('article');

    card.className = 'room-card';

    const art = document.createElement('div');

    art.className = 'room-art';

    art.textContent = ['🎤','🎧','🎵','💜','🌟','🎮'][i%6];

    const info = document.createElement('div');

    const name = document.createElement('div');

    name.className = 'room-name';

    name.textContent = room.name || 'Huka Room';

    const meta = document.createElement('div');

    meta.className = 'room-meta';

    meta.textContent =
      '👑 ' + (room.owner || 'Host') +
      ' · 👥 ' + (room.members || 0) +
      '/' + (room.seats || 9);

    info.append(name,meta);

    const bottom = document.createElement('div');

    bottom.className = 'room-bottom';

    const type = document.createElement('span');

    type.className = 'room-type';

    type.textContent = '🎙 Audio Room';

    const btn = document.createElement('button');

    btn.className = 'join';

    btn.textContent = 'Join';

    btn.onclick = () => joinRoom(room.id);

    bottom.append(type,btn);

    card.append(art,info,bottom);

    list.append(card);

  });

}

function joinRoom(id) {

  if (!id) return;

  location.href =
    'room.html?room=' + encodeURIComponent(id);

}

function createRoom() {

  if (!currentUser) {

    status('Please wait for profile connection.');

    return;
  }

  const name = $('newRoomName').value.trim();

  if (!name) {

    alert('Enter a room name.');

    return;
  }

  const seats = Number($('seatCount').value);

  status('Creating room...');

  socket.emit('create-room',{

    name,
    seats

  },res => {

    if (!res || !res.ok) {

      status(res?.error || 'Could not create room.');

      return;
    }

    location.href =
      'room.html?room=' + encodeURIComponent(res.id);

  });

}

function setTab(tab) {

  activeTab = tab;

  $('hotTab').classList.toggle('active',tab === 'hot');

  $('recommendTab').classList.toggle('active',tab === 'recommend');

  renderRooms();

}

function filterCountry(country) {

  activeCountry = country;

  renderRooms();

}

function searchRooms() {

  const term = prompt('Search room name or host:');

  if (term === null) return;

  const q = term.trim().toLowerCase();

  const filtered = allRooms.filter(r =>

    (r.name || '').toLowerCase().includes(q) ||

    (r.owner || '').toLowerCase().includes(q)

  );

  const old = allRooms;

  allRooms = filtered;

  renderRooms();

  allRooms = old;

}

</script>

</body>
</html>
